[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-family-lab"
version = "0.1.0"
description = "Chinese derivations and tested PyTorch implementations of the VAE family"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

